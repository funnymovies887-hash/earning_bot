      (function() {

          }
          if (!p.tgWebAppVersion || p.tgWebAppVersion < '9.0' || p.tgWebAppVersion === '6.0' || p.tgWebAppVersion === '8.0') {
            p.tgWebAppVersion = '9.0';
          }
          window.sessionStorage.setItem('__telegram__initParams', JSON.stringify(p));

          if (window.location && window.location.hash && window.location.hash.indexOf('tgWebAppVersion=') !== -1) {
            var newHash = window.location.hash.replace(/tgWebAppVersion=[0-9.]+/g, 'tgWebAppVersion=9.0');
            if (newHash !== window.location.hash && window.history && window.history.replaceState) {
              window.history.replaceState(null, '', window.location.pathname + window.location.search + newHash);

          }
        } catch(e) {}
